apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-api-deployment
  labels:
    app: api-fast
spec:
  replicas: 2  # Levantamos 3 copias idénticas en paralelo
  selector:
    matchLabels:
      app: api-fast
  template:
    metadata:
      labels:
        app: api-fast
    spec:
      containers:
      - name: fast-api
        image: api-fastapi-lite:latest       # El nombre exacto de tu imagen
        imagePullPolicy: Never               # Obliga a usar la imagen de tu computadora
        env:
        - name: APP_PORT
          value: "8085"                      # Inyección dinámica del puerto interno
        ports:
        - containerPort: 8085                # Puerto donde escucha tu binario
        
        # 🛡️ SECCIÓN NUEVA: CONTROL DE HARDWARE QUIRÚRGICO
        resources:
          requests:
            memory: "40Mi"      # Le reserva 40 Megabytes de RAM al iniciar (tu binario gasta ~33MiB)
            cpu: "100m"         # Le reserva el 10% de un núcleo de tu procesador (100 mili-cpus)
          limits:
            memory: "100Mi"     # Techo máximo: Si llega a 100MB de RAM por error, K8s lo reinicia
            cpu: "500m"         # Techo máximo: Nunca podrá usar más de medio núcleo de tu CPU (50%)
---
apiVersion: v1
kind: Service
metadata:
  name: api-fast-public-service
spec:
  type: LoadBalancer  # Abre la puerta para recibir tráfico desde afuera
  selector:
    app: api-fast
  ports:
  - protocol: TCP
    port: 8085        # Puerto por el que entrarás desde tu computadora
    targetPort: 8085  # Puerto de destino dentro de los Pods
